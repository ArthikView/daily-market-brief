.offline{min-height:75vh;display:grid;place-items:center;text-align:center;padding:32px}

.offline a{display:inline-block;margin-top:12px;padding:13px 18px;background:var(--navy);color:#fff;text-decoration:none;font:11px ui-monospace,monospace}

</head>
